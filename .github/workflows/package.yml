name: Package MandelQuest

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_suffix: linux
          - os: macos-latest
            artifact_suffix: macos
          - os: windows-latest
            artifact_suffix: windows
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python build tools
        run: python -m pip install --upgrade pip pyinstaller

      - name: Install Linux Fortran toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran make

      - name: Install macOS Fortran toolchain
        if: runner.os == 'macOS'
        run: |
          brew install gcc make
          echo "FC=gfortran-14" >> "$GITHUB_ENV"

      - name: Setup MSYS2 (Windows toolchain)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            make

      - name: Build Fortran renderer (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          make clean
          if [ -n "${FC:-}" ]; then
            make OPENMP=0 FC="$FC"
          else
            make OPENMP=0
          fi

      - name: Build Fortran renderer (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          workspace="$(cygpath -u "$GITHUB_WORKSPACE")"
          make clean OPENMP=0
          make OPENMP=0
          if [ -f mandelbrot_gen.exe ]; then
            cp mandelbrot_gen.exe "$workspace/mandelbrot_gen.exe"
          elif [ -f mandelbrot_gen ]; then
            cp mandelbrot_gen "$workspace/mandelbrot_gen.exe"
          else
            echo "Renderer binary not produced"
            exit 1
          fi

      - name: Run unit tests
        run: python -m unittest discover -s tests -q

      - name: Build PyInstaller bundle
        run: pyinstaller --noconfirm --clean mandelquest.spec

      - name: Create artifact archive (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd dist
          tar -czf "MandelQuest-${{ matrix.artifact_suffix }}.tar.gz" MandelQuest

      - name: Create artifact archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/MandelQuest/*" -DestinationPath "dist/MandelQuest-${{ matrix.artifact_suffix }}.zip" -Force

      - name: Upload build artifacts (Linux/macOS)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: MandelQuest-${{ matrix.artifact_suffix }}
          path: dist/MandelQuest-${{ matrix.artifact_suffix }}.tar.gz

      - name: Upload build artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: MandelQuest-${{ matrix.artifact_suffix }}
          path: dist/MandelQuest-${{ matrix.artifact_suffix }}.zip
