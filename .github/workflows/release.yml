name: Release MandelQuest

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact_suffix: linux
          - os: macos-13
            artifact_suffix: macos
          - os: windows-2022
            artifact_suffix: windows
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check repo for private deployment markers
        run: |
          python - <<'PY'
          import re
          import subprocess
          import sys
          from pathlib import Path

          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          excluded = {".gitignore"}
          patterns = [
              re.compile(r"192" + r"\.168" + r"\.1" + r"\.184"),
              re.compile("internal" + "server", re.IGNORECASE),
              re.compile("sync" + r"\." + "internal", re.IGNORECASE),
              re.compile(r"(^|[^A-Za-z0-9_])" + r"\." + "env" + r"([^A-Za-z0-9_]|$)"),
          ]
          hits = []
          for rel in tracked:
              if rel in excluded:
                  continue
              text = Path(rel).read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      hits.append(rel)
                      break
          if hits:
              print("Private deployment markers found in tracked files:", file=sys.stderr)
              for rel in hits:
                  print(f" - {rel}", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python build tools
        run: python -m pip install --upgrade pip pyinstaller

      - name: Install Linux Fortran toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran make

      - name: Install macOS Fortran toolchain
        if: runner.os == 'macOS'
        run: |
          brew install gcc make
          echo "FC=gfortran-14" >> "$GITHUB_ENV"

      - name: Setup MSYS2 (Windows toolchain)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gcc-fortran
            make

      - name: Build Fortran renderer (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          make clean
          if [ -n "${FC:-}" ]; then
            make OPENMP=0 FC="$FC"
          else
            make OPENMP=0
          fi

      - name: Build Fortran renderer (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          workspace="$(cygpath -u "$GITHUB_WORKSPACE")"
          FC_BIN="x86_64-w64-mingw32-gfortran"
          make clean OPENMP=0 FC="$FC_BIN"
          make OPENMP=0 FC="$FC_BIN"
          if [ -f mandelbrot_gen.exe ]; then
            cp mandelbrot_gen.exe "$workspace/mandelbrot_gen.exe"
          elif [ -f mandelbrot_gen ]; then
            cp mandelbrot_gen "$workspace/mandelbrot_gen.exe"
          else
            echo "Renderer binary not produced"
            exit 1
          fi

      - name: Run unit tests
        run: python -m tests.run_isolated

      - name: Build PyInstaller bundle
        run: pyinstaller --noconfirm --clean mandelquest.spec

      - name: Smoke-test packaged app (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          export MANDELQUEST_DATA_DIR="$RUNNER_TEMP/mandelquest-smoke-${{ matrix.artifact_suffix }}"
          mkdir -p "$MANDELQUEST_DATA_DIR"
          ./dist/MandelQuest/MandelQuest --smoke-test

      - name: Smoke-test packaged app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:MANDELQUEST_DATA_DIR = Join-Path $env:RUNNER_TEMP "mandelquest-smoke-${{ matrix.artifact_suffix }}"
          New-Item -ItemType Directory -Path $env:MANDELQUEST_DATA_DIR -Force | Out-Null
          & "dist/MandelQuest/MandelQuest.exe" --smoke-test

      - name: Create archive (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd dist
          tar -czf "MandelQuest-${{ matrix.artifact_suffix }}.tar.gz" MandelQuest

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/MandelQuest/*" -DestinationPath "dist/MandelQuest-${{ matrix.artifact_suffix }}.zip" -Force

      - name: Upload release artifact (Linux/macOS)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact_suffix }}
          path: dist/MandelQuest-${{ matrix.artifact_suffix }}.tar.gz

      - name: Upload release artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact_suffix }}
          path: dist/MandelQuest-${{ matrix.artifact_suffix }}.zip

  publish:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
