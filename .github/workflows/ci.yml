name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Fortran toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran make python3-tk

      - name: Run clean-checkout contract
        run: make check OPENMP=0
